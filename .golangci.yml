version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - misspell
    - predeclared
    - revive
    - unconvert

  settings:
    # Enforces the zero-runtime-dependency rule: nothing outside the standard
    # library may be imported by the library code. Tests are exempt.
    depguard:
      rules:
        library:
          files:
            - "**/api/**/*.go"
            - "!$test"
          # Allow-list only: anything absent is rejected. A deny entry would
          # win over allow and would also reject the module importing itself.
          allow:
            - $gostd
            - github.com/glours/go2funk

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Test helpers and examples do not need doc comments.
      - path: _test\.go
        linters:
          - revive
      # Tests spell out the type on the left-hand side on purpose: that
      # annotation is the assertion that a generic method changed the type
      # parameter. Inferring it would remove what the test checks.
      - path: _test\.go
        linters:
          - staticcheck
        text: "(ST1023|QF1011)"

issues:
  # Report everything: golangci-lint truncates to 3 per linter by default.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
